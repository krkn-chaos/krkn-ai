name: Docker Images CI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. 0.0.3)"
        required: true
        default: "0.0.x"
      image:
        description: "Image to build and push"
        required: true
        type: choice
        options:
          - krkn-ai
          - krkn-ai-operator
          - krkn-ai-service
          - all
        default: all
      push_latest:
        description: "Also tag as latest"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # Releases are intentionally manual, but only the protected main ref may
    # publish or sign production images.
    if: ${{ github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Determine tags
        id: tags
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          if [[ ! "$IMAGE_TAG" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]{0,127}$ ]]; then
            echo "Invalid image tag" >&2
            exit 1
          fi
          TAGS="quay.io/krkn-chaos/krkn-ai:$IMAGE_TAG"
          OPERATOR_TAGS="quay.io/krkn-chaos/krkn-ai-operator:$IMAGE_TAG"
          SERVICE_TAGS="quay.io/krkn-chaos/krkn-ai-service:$IMAGE_TAG"
          if [ "$PUSH_LATEST" = "true" ]; then
            TAGS="${TAGS},quay.io/krkn-chaos/krkn-ai:latest"
            OPERATOR_TAGS="${OPERATOR_TAGS},quay.io/krkn-chaos/krkn-ai-operator:latest"
            SERVICE_TAGS="${SERVICE_TAGS},quay.io/krkn-chaos/krkn-ai-service:latest"
          fi
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"
          echo "operator_tags=${OPERATOR_TAGS}" >> "$GITHUB_OUTPUT"
          echo "service_tags=${SERVICE_TAGS}" >> "$GITHUB_OUTPUT"
          echo "image=quay.io/krkn-chaos/krkn-ai:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "operator_image=quay.io/krkn-chaos/krkn-ai-operator:$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "service_image=quay.io/krkn-chaos/krkn-ai-service:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Quay
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Build and push krkn-ai image
        id: build-ai
        if: ${{ inputs.image == 'krkn-ai' || inputs.image == 'all' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: containers/Containerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          provenance: false
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.tag }}

      # Sign the immutable digest emitted by Buildx, never a mutable tag.
      - name: Sign krkn-ai image with cosign
        if: ${{ inputs.image == 'krkn-ai' || inputs.image == 'all' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build-ai.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --signing-config "${GITHUB_WORKSPACE}/.github/cosign/signing-config.json" --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"

      - name: Build and push krkn-ai operator image
        id: build-operator
        if: ${{ inputs.image == 'krkn-ai-operator' || inputs.image == 'all' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: containers/Containerfile.operator
          push: true
          tags: ${{ steps.tags.outputs.operator_tags }}
          provenance: false
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.tag }}


      - name: Sign krkn-ai operator image with cosign
        if: ${{ inputs.image == 'krkn-ai-operator' || inputs.image == 'all' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.tags.outputs.operator_image }}
          DIGEST: ${{ steps.build-operator.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --signing-config "${GITHUB_WORKSPACE}/.github/cosign/signing-config.json" --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"
      - name: Build and push krkn-ai-service image
        id: build-service
        if: ${{ inputs.image == 'krkn-ai-service' || inputs.image == 'all' }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: containers/Containerfile.server
          push: true
          tags: ${{ steps.tags.outputs.service_tags }}
          provenance: false
          build-args: |
            SETUPTOOLS_SCM_PRETEND_VERSION=${{ inputs.tag }}

      - name: Sign krkn-ai service image with cosign
        if: ${{ inputs.image == 'krkn-ai-service' || inputs.image == 'all' }}
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          IMAGE: ${{ steps.tags.outputs.service_image }}
          DIGEST: ${{ steps.build-service.outputs.digest }}
        run: |
          set -euo pipefail
          REF="${IMAGE%:*}@${DIGEST}"
          echo "Signing ${REF}"
          cosign sign --yes --signing-config "${GITHUB_WORKSPACE}/.github/cosign/signing-config.json" --key env://COSIGN_PRIVATE_KEY "${REF}"
          cosign public-key --key env://COSIGN_PRIVATE_KEY > /tmp/cosign.pub
          cosign verify --insecure-ignore-tlog=true --key /tmp/cosign.pub "${REF}"
